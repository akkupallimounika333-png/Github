<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management - Java MVC</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="container">
    <h1>Student Management System</h1>
    <p class="subtitle">Frontend → Controller → Service → Repository → H2 Database</p>

    <form action="/students/save" method="post" class="card">
        <h2>Add Student</h2>
        <input type="text" name="name" placeholder="Student name" required>
        <input type="email" name="email" placeholder="Email" required>
        <input type="text" name="course" placeholder="Course" required>
        <button type="submit">Save Student</button>
    </form>

    <div class="card">
        <h2>Students</h2>
        <table>
            <thead>
            <tr><th>ID</th><th>Name</th><th>Email</th><th>Course</th><th>Action</th></tr>
            </thead>
            <tbody>
            <tr th:each="s : ${students}">
                <td th:text="${s.id}"></td>
                <td th:text="${s.name}"></td>
                <td th:text="${s.email}"></td>
                <td th:text="${s.course}"></td>
                <td><a class="delete" th:href="@{/students/delete/{id}(id=${s.id})}">Delete</a></td>
            </tr>
            </tbody>
        </table>
        <p th:if="${#lists.isEmpty(students)}">No students yet.</p>
    </div>

    <a href="/h2-console" target="_blank">Open H2 Database Console</a>
</div>
<script src="/js/app.js"></script>
</body>
</html>
